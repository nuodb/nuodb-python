[build-system]
requires = ["setuptools>=40.8.0", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
# PyPy: pynuodb/_fetch.pyx calls _PyLong_FromByteArray, a private CPython
# C-API function PyPy doesn't provide.
# win32/*_i686: untested 32-bit targets; the MSVC portability shim in
# _fetch.pyx also only implements the 64-bit _BitScanReverse64 intrinsic.
skip = ["pp*", "*-win32", "*-manylinux_i686", "*-musllinux_i686"]

# Smoke-test the compiled extension so a build that "succeeds" but produces
# a broken/mismatched .so fails CI instead of silently shipping.
test-command = "python -c \"import pynuodb; import pynuodb._fetch\""
