name: Release publish

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  id-token: write

jobs:
  pipeline:
    uses: ./.github/workflows/release-pipeline.yml

  publish:
    name: Publish to PyPI and GitHub Release
    needs: pipeline
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gha-release-bundle-dist
          path: dist
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist
      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: pynuodb ${{ needs.pipeline.outputs.package_version }}
          prerelease: ${{ needs.pipeline.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/*